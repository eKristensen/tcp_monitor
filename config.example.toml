# tcp-monitor configuration
# Copy to /etc/tcp-monitor/config.toml and edit for each node.
# Run "systemctl reload tcp-monitor" (SIGHUP) to apply peer changes live.
# Changes to [server] bind/port/probe_port/metrics_port and [client] timing
# (including [client.pool]) require a full restart.

[node]
# Unique name for this node. Appears as the "node" label in all metrics,
# and is sent to peer servers so they can label inbound sessions by name.
name = "server1"

[server]
bind                   = "0.0.0.0"   # literal IP only; IPv6 in brackets, e.g. "[::]"
heartbeat_port         = 9700   # port where peer clients connect
probe_port             = 9701   # Blackbox Exporter probe port (sends "TCP-MONITOR OK\r\n")
metrics_port           = 9702   # Prometheus scrape endpoint  GET /metrics  (binds 0.0.0.0: firewall it)
heartbeat_recv_timeout = 90     # seconds with no heartbeat before a server session is declared timed out
probe_idle_timeout     = 30     # seconds before a probe connection that never closes is dropped

# Optional: connect to these peers as a client.
# Remove the [client] section and all [[peers]] entries to run as server-only.
[client]
heartbeat_interval = 30   # seconds between outbound heartbeats
max_misses         = 3    # consecutive missed echoes before closing the session
reconnect_delay    = 10   # seconds to wait before reconnecting after a disconnect

# Optional: a pool of staggered sessions to every peer, for paths through a
# stateful load balancer that pins each session to the backend it picked when
# the session opened. One long-lived session only tests one backend; the pool
# holds sessions pinned at many different times, so it notices when the
# sessions pinned to one backend die. See "Session pools" in the README.
# Peers must run a version with session pool support (handshake v2).
# Uncomment to enable; without it, each peer gets only the one primary session.
#[client.pool]
#open_interval = 900     # seconds between new pool sessions to each peer (±10%)
#lifetime      = 86400   # mean planned session lifetime in seconds (each draws 50%–150%)
#                        # pool size per peer = lifetime / open_interval = 96

[[peers]]
name = "server2"
host = "192.168.1.2"
heartbeat_port = 9700

[[peers]]
name = "server3"
host = "192.168.1.3"
heartbeat_port = 9700

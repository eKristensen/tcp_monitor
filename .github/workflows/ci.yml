name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned so a new clippy release cannot break CI on its own. Bump
      # deliberately and fix any new findings in the same change.
      - name: Install Rust 1.97
        uses: dtolnay/rust-toolchain@1.97
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: Tests and integration scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Unit and integration tests
        run: cargo test --locked

      - name: Build (release)
        run: cargo build --release --locked

      - name: Server startup, metrics, and probe test
        run: ci/server-startup-test.sh

      - name: End-to-end heartbeat test
        run: ci/e2e-test.sh

      - name: SIGHUP reload tests
        run: ci/sighup-test.sh

      - name: Validate systemd unit file
        run: ci/systemd-test.sh

  msrv:
    name: Minimum supported Rust (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Must match `rust-version` in Cargo.toml.
      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@1.85

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Tests on MSRV
        run: cargo test --locked
